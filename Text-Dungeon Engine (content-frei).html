<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Text-Dungeon-Crawler // Engine</title>
  <style>
    :root {
      --bg: #0c0a12;
      --bg-2: #151220;
      --accent: #8b6fb8;
      --accent-2: #c98a6e;
      --text: #e9e2ea;
      --text-dim: #948a9c;
      --danger: #a8425c;
      --border: rgba(233, 226, 234, 0.08);
      font-size: 16px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, system-ui, sans-serif;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    body {
      min-height: 100%;
      display: flex;
      justify-content: center;
    }

    #app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      background: rgba(12, 10, 18, 0.92);
      backdrop-filter: blur(6px);
      z-index: 5;
    }

    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }

    .game-title {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .room-name {
      font-size: 1rem;
      color: var(--accent);
    }

    .meter-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.68rem;
      color: var(--text-dim);
      margin-bottom: 5px;
    }

    .meter-track {
      height: 7px;
      border-radius: 5px;
      background: var(--bg-2);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .meter-fill {
      height: 100%;
      border-radius: 5px;
      background: linear-gradient(90deg, var(--accent-2), var(--accent));
      transition: width 0.4s ease;
    }

    main {
      flex: 1;
      padding: 22px 20px 12px;
      overflow-y: auto;
    }

    .scene-text {
      font-size: 1.02rem;
      line-height: 1.65;
      margin: 0 0 16px;
    }

    .threshold-text {
      font-size: 0.96rem;
      line-height: 1.6;
      color: var(--text-dim);
      margin: 0 0 18px;
      padding-left: 14px;
      border-left: 2px solid var(--accent-2);
    }

    .hidden-thought {
      margin: 0 0 18px;
      padding: 14px 16px;
      background: rgba(139, 111, 184, 0.09);
      border: 1px solid rgba(139, 111, 184, 0.25);
      border-radius: 10px;
      font-size: 0.9rem;
      line-height: 1.55;
      color: var(--accent);
    }

    .hidden-thought .tag {
      display: block;
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent-2);
      margin-bottom: 6px;
    }

    .hidden-thought p {
      margin: 0 0 8px;
      font-size: inherit;
      line-height: inherit;
      color: inherit;
    }

    .hidden-thought p:last-child {
      margin-bottom: 0;
    }

    /* Übergangs-Log: Konsequenz der letzten Entscheidung, klar abgesetzt
     vom neuen Szenentext, mit kurzer Einblend-Animation. */
    .transition {
      margin: 0 0 22px;
      animation: transitionIn 0.45s ease;
    }

    .transition-log {
      padding: 14px 16px;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent-2);
      border-radius: 10px;
      font-size: 0.95rem;
      line-height: 1.55;
      color: var(--text);
    }

    .transition-log p {
      margin: 0 0 8px;
    }

    .transition-log p:last-child {
      margin-bottom: 0;
    }

    .transition-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 16px 0;
      color: var(--text-dim);
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .transition-divider::before,
    .transition-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    @keyframes transitionIn {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .choices {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 8px 20px 24px;
    }

    .choice-btn {
      width: 100%;
      text-align: left;
      padding: 15px 16px;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.94rem;
      line-height: 1.4;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 52px;
      transition: transform 0.1s, background 0.15s;
    }

    .choice-btn:active {
      transform: scale(0.98);
      background: #1c1826;
    }

    .choice-btn.type-a {
      border-left: 3px solid var(--accent-2);
    }

    .choice-btn.type-b {
      border-left: 3px solid var(--accent);
    }

    .choice-btn.neutral {
      border-left: 3px solid var(--text-dim);
    }

    .choice-btn .difficulty {
      margin-left: auto;
      font-size: 0.63rem;
      color: var(--text-dim);
      white-space: nowrap;
    }

    .lock-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px;
      text-align: center;
      z-index: 50;
    }

    .lock-screen h1 {
      font-size: 1.2rem;
      color: var(--accent);
      margin-bottom: 14px;
    }

    .lock-screen p {
      color: var(--text-dim);
      font-size: 0.9rem;
      line-height: 1.65;
      max-width: 340px;
    }

    .lock-badge {
      margin-top: 24px;
      font-size: 0.63rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--danger);
      border: 1px solid rgba(168, 66, 92, 0.4);
      padding: 6px 14px;
      border-radius: 20px;
    }

    .reset-btn {
      margin-top: 20px;
      padding: 8px 16px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      border-radius: 8px;
      font-size: 0.75rem;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div id="app">
    <header>
      <div class="title-row">
        <span class="game-title">Dungeon Engine</span>
        <span class="room-name" id="roomName">—</span>
      </div>
      <div class="meter-label">
        <span id="meterLabel">Stat A</span>
        <span id="meterValue">0 / 100</span>
      </div>
      <div class="meter-track">
        <div class="meter-fill" id="meterFill" style="width:0%"></div>
      </div>
    </header>

    <main id="main"></main>
    <div class="choices" id="choices"></div>
  </div>

  <script>
    /* =========================================================================
   GENERISCHE TEXT-DUNGEON-ENGINE — ohne Inhalte.
   Alles Erzählerische kommt ausschließlich aus SCENES{} und CONFIG{}.
   Diese Datei enthält NUR Struktur/Logik, keine Story.

   Aufbau:
   1. CONFIG        – globale Einstellungen (Stat-Name, Startwerte, Storage-Keys)
   2. SCENES{}       – dein Content geht hier rein (aktuell 1 Platzhalter)
   3. ENDINGS{}      – deine Ending-Texte gehen hier rein
   4. Engine-Code    – unverändert lassen, greift nur auf 1–3 zu
   ========================================================================= */

    const CONFIG = {
      storageKeySave: "dungeon_save_v1",
      storageKeyLock: "dungeon_ending_locked",
      startScene: "PROLOG",
      startStatValue: 25,
      statMin: 0,
      statMax: 100,
      statLabel: "Lust", // z.B. "Erregung", "Mana", "Verdacht" ...
    };

    /* ---------------------------------------------------------------------
       2. SCENES — Datenmodell pro Szene:

       "sceneId": {
         title: string,
         baseText: string,                  // immer sichtbarer Basistext
         thresholdTexts: [                  // optional, je nach Statwert
           { min: number, max: number, text: string }
         ],
         hiddenThought: {                   // optional, ab Schwellwert sichtbar
           unlockAt: number,
           tag: string,
           text: string
         },
         choices: [
           {
             id: string,
             type: "type-a" | "type-b" | "neutral",   // rein visuelle Kategorie, frei belegbar
             icon: string,
             text: string,
             difficultyLabel: string,        // optional, nur Anzeige
             successChance: number,          // 0–1, Wahrscheinlichkeit für onSuccess
             requiresStat: number,           // optional, harte Voraussetzung (Gate)
             onSuccess: { next, statDelta, log } | { ending: "endingId" },
             onFail:    { next, statDelta, log },
             onFailRequirement: { next, statDelta, log }  // falls requiresStat nicht erfüllt
           }
         ],
         isFinalGate: boolean                // optional, nur zur eigenen Orientierung
       }
       --------------------------------------------------------------------- */

    const SCENES = {

      "PROLOG": {
        title: "Prolog",
        baseText: "Nothing\nNothing but darkness surrounds you.\nYou wonder Who you are and where you at?\nAnd just as you think those thoughts it feels like the darkness is laughing at you devilishly.\nYou try to look around but to no avail... There must be SOMETHING her...\nARGH\nA slight twinge near your belly button makes you flinch. You look down and, for a brief moment, it seems like...\n There was a flash of light. You were sure you saw it. Like some kind of... strange pattern.",

              statDelta: -1,

          {
            id: "placeholder_choice_b",
            type: "type-b",
            icon: "◆",
            text: "Try to remember the symbol",

            successChance: 0.4,
            onSuccess: {
              next: "SLEEP",
              statDelta: 10,
              log: "+10 Lust.\n\nIt was A delicate,sigil-like marking traced in faded obsidian and muted rose gold, nestled just above the curve of the hip and fading toward the center of the abdomen.\nThe mark resembles a stylized, inverted crescent moon interwoven with thorny, thorned vines that taper off into fine, ink-like wisps against the skin.\nBeneath low light, the inner linework catches a faint, bioluminescent shimmer—less like a tattoo and more like an ancient scar born of velvet and starlight.\nIt pulses with a soft, imperceptible warmth, serving as a subtle, captivating emblem of innate allure and quiet power.\nYou somehow feel like you should note yourself the letter 'S'\nYou pass out. Everything turns black again"
            },
            onFail: {
              next: "SLEEP",
              statDelta: -3,
              log: "-3 Lust.\n\nYou try your hardest but you just cant remember anything. You were sure it was something important... but you cant remember.\nAll that thinking has worn you out, and in the end, you fall asleep..."
            }
          },
          {
            id: "placeholder_choice_neutral",
            type: "neutral",
            icon: "○",
            text: "Just go back to sleep",
            successChance: 1,
            onSuccess: {
              next: "SLEEP",
              statDelta: -2,
              log: "-2 Lust.\n\nYou dont care and you dont want to know. You just want to sleep"
            }
          },
          {
            id: "placeholder_choice_gate",
            type: "type-b",
            icon: "⛒♥",
            text: "Start to masturbate",
            difficultyLabel: "Needs 'Lust' >= 50",
            requiresStat: 50,
            onSuccess: {
              ending: "ending_a"
            },
            onFailRequirement: {
              next: "SLEEP",
              statDelta: 0,
              log: "+0 Lust.\nThe moment you try to touch yourself, you realize that you are not even sure if you have a body. You feel like you are just a consciousness floating in the void. You cant even feel your own body. You are not sure if you even have a body.\nYou pass out. Everything turns black again."
            }
          }
        ]
      },
      // After Prolog Choices
      "SLEEP": {
        title: "SLEEP",
        baseText: "Sleep washes over you and carries you from one darkness into the next. Endless expanses of black nothingness.\nYou aren’t dreaming—or at least, you can’t remember doing so. So you wait to wake up…\nBut you don’t…\nDid you really fall asleep? Could you even have fallen asleep? Everything that happened earlier didn’t exactly seem like a dream[...]\n.",
        thresholdTexts: [{
            min: 0,
            max: 25,
            text: ""
          },
          {
            min: 35,
            max: 100,
            text: ""
          }
        ],
        hiddenThought: {
          unlockAt: 60,
          tag: "[LABEL]",
          text: "[VERBORGENER GEDANKE]"
        },
        choices: [{
            id: "placeholder_choice_a",
            type: "type-a",
            icon: "◆",

            difficultyLabel: "Curiosity",
            successChance: 1,
            onSuccess: {

              statDelta: 1,

            },
          },
          {
            id: "placeholder_choice_b",

            },
          },
          {
            id: "placeholder_choice_neutral",
            type: "neutral",
            icon: "○",
            text: "Open your eyes",
            successChance: 1,
            onSuccess: {
              next: "SLEEP",
              statDelta: 0,
              log: "Really...? Did you seriously think that would work?\nYou see nothing..."
            }
          },
          {
            id: "placeholder_choice_gate",
            type: "type-b",
            icon: "⛒",
            text: "[FINALE OPTION — Beispiel für hartes Gate]",
            difficultyLabel: "Erfordert Stat ≥ 50",
            requiresStat: 50,
            onSuccess: {
              ending: "ending_a"
            },
            onFailRequirement: {
              next: "PLACEHOLDER_SCENE",
              statDelta: 0,
              log: "[TEXT BEI NICHTERFÜLLTER VORAUSSETZUNG]"
            }
          }
        ]
      },
      // After SLEEP Choices
      "WHO_YOU_ARE": {
        title: "What is inside",
        baseText: "You look around, and not much has really changed. The blackness around you is just as dark as before. But this time, something is different.\nThree doors have suddenly appeared in front of you.\nA green birchwood door adorned with emerald-colored diamonds and enchanting tendrils of delicate orchid blossoms. The word “Hijabi” is written on it in gently curving letters.\nNext to it, barely visible, standing in the middle, is a black door. No decorations or flourishes—just a small, gold-inlaid round doorknob set into the door.\nOn the very outside is a door that’s fiery red… now a beguiling shade of purple… and now a sea-blue door. The door continuously shifts its colors into very pleasant, alluring shades. In its center, as if nothing else had ever been there, stands the word “Whore.",
        thresholdTexts: [{
            min: 0,
            max: 49,
            text: "Ein kleines ziehen zieht sich durch deinen Bauch"
          },
          {
            min: 50,
            max: 100,
            text: "A slight tugging sensation runs through your stomach. It feels... good"
          }
        ],
        hiddenThought: {
          unlockAt: 60,
          tag: "[LABEL]",
          text: "[VERBORGENER GEDANKE]"
        },
        choices: [{
            id: "placeholder_choice_a",
            type: "type-a",
            icon: "◆",
            text: "Go towards the green Door",
            difficultyLabel: "Purity",
            successChance: 0.5,
            onSuccess: {
              next: "THE_DREAMLAND",
              statDelta: 1,
              log: "This feels like a dream but you are not sure"
            },
            onFail: {
              next: "SLEEP",
              statDelta: 0,
              log: "You pass out. And as you wake up you wonder what a strange dream that was..."
            }
          },
          {
            id: "placeholder_choice_b",
            type: "type-b",
            icon: "◆♥",
            text: "Walk towards the black Door",
            difficultyLabel: "Unknown",
            successChance: 0.5,
            onSuccess: {
              next: "THE_DREAMLAND",
              statDelta: 10,
              log: "[ERFOLGSTEXT B]"
            },
            onFail: {
              next: "SLEEP",
              statDelta: -3,
              log: "You try your hardest but you just cant remember anything. You were sure it was something important..."
            }
          },
          {
            id: "placeholder_choice_neutral",
            type: "neutral",
            icon: "○",
            text: "[NEUTRALE OPTION]",
            successChance: 1,
            onSuccess: {
              next: "PLACEHOLDER_SCENE",
              statDelta: 0,
              log: null
            }
          },
          {
            id: "placeholder_choice_gate",
            type: "type-b",
            icon: "⛒",
            text: "[FINALE OPTION — Beispiel für hartes Gate]",
            difficultyLabel: "Erfordert Stat ≥ 50",
            requiresStat: 50,
            onSuccess: {
              ending: "ending_a"
            },
            onFailRequirement: {
              next: "PLACEHOLDER_SCENE",
              statDelta: 0,
              log: "[TEXT BEI NICHTERFÜLLTER VORAUSSETZUNG]"
            }
          }
        ]
      }

    };

    /* ---------------------------------------------------------------------
       3. ENDINGS — beliebig viele möglich, referenziert über choice.onSuccess.ending
       --------------------------------------------------------------------- */

    const ENDINGS = {
      "ending_a": {
        title: "[ENDING TITEL A]",
        text: "[ENDING TEXT A]"
      },
      "ending_b": {
        title: "[ENDING TITEL B]",
        text: "[ENDING TEXT B]"
      }
    };

    /* =========================================================================
       4. ENGINE — ab hier nichts Inhaltliches. Nicht anfassen, wenn nur
       Content ergänzt werden soll.
       ========================================================================= */

    let state = loadState();

    function loadState() {
      const raw = localStorage.getItem(CONFIG.storageKeySave);
      if (raw) {
        try {
          return JSON.parse(raw);
        } catch (e) {
          /* fällt durch */
        }
      }
      return {
        currentScene: CONFIG.startScene,
        stat: CONFIG.startStatValue,
        log: []
      };
    }

    function saveState() {
      localStorage.setItem(CONFIG.storageKeySave, JSON.stringify(state));
    }

    function isLocked() {
      return localStorage.getItem(CONFIG.storageKeyLock) !== null;
    }

    function lockGame(endingId) {
      localStorage.setItem(CONFIG.storageKeyLock, JSON.stringify({
        ending: endingId,
        timestamp: new Date().toISOString()
      }));
    }

    function resetGame() {
      localStorage.removeItem(CONFIG.storageKeySave);
      localStorage.removeItem(CONFIG.storageKeyLock);
      state = loadState();
      render();
    }

    const mainEl = document.getElementById("main");
    const choicesEl = document.getElementById("choices");
    const roomNameEl = document.getElementById("roomName");
    const meterFillEl = document.getElementById("meterFill");
    const meterValueEl = document.getElementById("meterValue");
    const meterLabelEl = document.getElementById("meterLabel");

    function pickThreshold(scene, statValue) {
      if (!scene.thresholdTexts) return null;
      return scene.thresholdTexts.find(t => statValue >= t.min && statValue <= t.max);
    }

    /* Rendert einen Text-String mit \n als Absatzumbrüchen.
       Erzeugt für jeden Abschnitt ein eigenes <p>-Element mit der übergebenen
       Klasse und hängt sie an container an. Nutzt textContent (kein innerHTML),
       damit beliebiger Content-Text sicher bleibt. */
    function renderMultilineText(container, text, className) {
      if (!text) return;
      const paragraphs = text.split("\n").filter(line => line.trim().length > 0);
      paragraphs.forEach(paragraph => {
        const p = document.createElement("p");
        p.className = className;
        p.textContent = paragraph;
        container.appendChild(p);
      });
    }

    function render() {
      meterLabelEl.textContent = CONFIG.statLabel;

      if (isLocked()) {
        renderLockScreen();
        return;
      }

      const scene = SCENES[state.currentScene];
      if (!scene) {
        mainEl.innerHTML = `<p class="scene-text">Fehler: Szene "${state.currentScene}" existiert nicht in SCENES{}.</p>`;
        choicesEl.innerHTML = "";
        return;
      }

      roomNameEl.textContent = scene.title;
      meterFillEl.style.width = state.stat + "%";
      meterValueEl.textContent = state.stat + " / " + CONFIG.statMax;

      mainEl.innerHTML = "";

      // Übergangs-Log: was die letzte Entscheidung bewirkt hat, klar sichtbar
      // VOR dem neuen Szenentext, damit sich der Wechsel wie eine Konsequenz liest.
      const lastLog = state.log[state.log.length - 1];
      if (lastLog) {
        const transition = document.createElement("div");
        transition.className = "transition";

        const logBox = document.createElement("div");
        logBox.className = "transition-log";
        renderMultilineText(logBox, lastLog, "");
        transition.appendChild(logBox);

        const divider = document.createElement("div");
        divider.className = "transition-divider";
        divider.textContent = scene.title;
        transition.appendChild(divider);

        mainEl.appendChild(transition);
      }

      renderMultilineText(mainEl, scene.baseText, "scene-text");

      const threshold = pickThreshold(scene, state.stat);
      if (threshold) {
        renderMultilineText(mainEl, threshold.text, "threshold-text");
      }

      if (scene.hiddenThought && state.stat >= scene.hiddenThought.unlockAt) {
        const box = document.createElement("div");
        box.className = "hidden-thought";
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = scene.hiddenThought.tag;
        box.appendChild(tag);
        renderMultilineText(box, scene.hiddenThought.text, "");
        mainEl.appendChild(box);
      }

      renderChoices(scene);
    }

    function renderChoices(scene) {
      choicesEl.innerHTML = "";
      scene.choices.forEach(choice => {
        const btn = document.createElement("button");
        btn.className = "choice-btn " + choice.type;
        const meetsReq = !choice.requiresStat || state.stat >= choice.requiresStat;
        btn.innerHTML = `
      <span>${choice.icon || ""}</span>
      <span>${choice.text}</span>
      ${choice.difficultyLabel ? `<span class="difficulty">${meetsReq ? choice.difficultyLabel : "You dont have enough lust"}</span>` : ""}
    `;
        btn.addEventListener("click", () => resolveChoice(choice));
        choicesEl.appendChild(btn);
      });
    }

    function resolveChoice(choice) {
      // Hartes Gate prüfen
      if (choice.requiresStat && state.stat < choice.requiresStat) {
        applyOutcome(choice.onFailRequirement);
        return;
      }

      // Direkter Ending-Trigger ohne Probe
      if (choice.onSuccess && choice.onSuccess.ending && choice.successChance === undefined) {
        triggerEnding(choice.onSuccess.ending);
        return;
        const target = (choice.successChance ? ? 1.0) + (state.stat / 100);
      }


      const roll = Math.random() * 100;
      const target = (choice.successChance ? ? 1.0) + (state.stat / 100);
      const success = roll <= target;
      applyOutcome(outcome);
    }

    function applyOutcome(outcome) {
      if (!outcome) return;

      if (outcome.ending) {
        triggerEnding(outcome.ending);
        return;
      }

      state.stat = Math.max(CONFIG.statMin, Math.min(CONFIG.statMax, state.stat + (outcome.statDelta || 0)));
      state.currentScene = outcome.next;
      state.log.push(outcome.log || null);
      saveState();
      render();
    }

    function triggerEnding(endingId) {
      lockGame(endingId);
      render();
    }

    function renderLockScreen() {
      const lockData = JSON.parse(localStorage.getItem(CONFIG.storageKeyLock));
      const ending = ENDINGS[lockData.ending] || {
        title: "[UNBEKANNTES ENDING: " + lockData.ending + "]",
        text: ""
      };

      mainEl.innerHTML = "";
      choicesEl.innerHTML = "";
      roomNameEl.textContent = "Abgeschlossen";
      meterFillEl.style.width = "100%";
      meterValueEl.textContent = "—";

      const screen = document.createElement("div");
      screen.className = "lock-screen";
      screen.innerHTML = `
    <h1>${ending.title}</h1>
    <p>${ending.text}</p>
    <div class="lock-badge">Einweg-Erfahrung — bereits abgeschlossen</div>
    <button class="reset-btn" id="resetBtn">Lokal zurücksetzen (Dev-Only)</button>
  `;
      document.getElementById("app").appendChild(screen);
      document.getElementById("resetBtn").addEventListener("click", resetGame);
    }

    render();
  </script>
</body>
