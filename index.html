<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Dungeon</title>
  <style>
    :root {
      --bg: #0c0a12;
      --bg-2: #151220;
      --accent: #8b6fb8;
      --accent-2: #c98a6e;
      --text: #e9e2ea;
      --text-dim: #948a9c;
      --danger: #a8425c;
      --border: rgba(233, 226, 234, 0.08);
      font-size: 16px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, system-ui, sans-serif;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    body {
      min-height: 100%;
      display: flex;
      justify-content: center;
    }

    #app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      background: rgba(12, 10, 18, 0.92);
      backdrop-filter: blur(6px);
      z-index: 5;
    }

    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }

    .game-title {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .room-name {
      font-size: 1rem;
      color: var(--accent);
    }

    .meter-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.68rem;
      color: var(--text-dim);
      margin-bottom: 5px;
    }

    .meter-track {
      height: 7px;
      border-radius: 5px;
      background: var(--bg-2);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .meter-fill {
      height: 100%;
      border-radius: 5px;
      background: linear-gradient(90deg, var(--accent-2), var(--accent));
      transition: width 0.4s ease;
    }

    main {
      flex: 1;
      padding: 22px 20px 12px;
      overflow-y: auto;
    }

    .scene-text {
      font-size: 1.02rem;
      line-height: 1.65;
      margin: 0 0 16px;
    }

    .threshold-text {
      font-size: 0.96rem;
      line-height: 1.6;
      color: var(--text-dim);
      margin: 0 0 18px;
      padding-left: 14px;
      border-left: 2px solid var(--accent-2);
    }

    .hidden-thought {
      margin: 0 0 18px;
      padding: 14px 16px;
      background: rgba(139, 111, 184, 0.09);
      border: 1px solid rgba(139, 111, 184, 0.25);
      border-radius: 10px;
      font-size: 0.9rem;
      line-height: 1.55;
      color: var(--accent);
    }

    .hidden-thought .tag {
      display: block;
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent-2);
      margin-bottom: 6px;
    }

    .hidden-thought p {
      margin: 0 0 8px;
      font-size: inherit;
      line-height: inherit;
      color: inherit;
    }

    .hidden-thought p:last-child {
      margin-bottom: 0;
    }

    /* Übergangs-Log: Konsequenz der letzten Entscheidung, klar abgesetzt
     vom neuen Szenentext, mit kurzer Einblend-Animation. */
    .transition {
      margin: 0 0 22px;
      animation: transitionIn 0.45s ease;
    }

    .transition-log {
      padding: 14px 16px;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent-2);
      border-radius: 10px;
      font-size: 0.95rem;
      line-height: 1.55;
      color: var(--text);
    }

    .transition-log p {
      margin: 0 0 8px;
    }

    .transition-log p:last-child {
      margin-bottom: 0;
    }

    .transition-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 16px 0;
      color: var(--text-dim);
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .transition-divider::before,
    .transition-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    @keyframes transitionIn {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .choices {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 8px 20px 24px;
    }

    .choice-btn {
      width: 100%;
      text-align: left;
      padding: 15px 16px;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.94rem;
      line-height: 1.4;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 52px;
      transition: transform 0.1s, background 0.15s;
    }

    .choice-btn:active {
      transform: scale(0.98);
      background: #1c1826;
    }

    .choice-btn.type-a {
      border-left: 3px solid var(--accent-2);
    }

    .choice-btn.type-b {
      border-left: 3px solid var(--accent);
    }

    .choice-btn.neutral {
      border-left: 3px solid var(--text-dim);
    }

    .choice-btn .difficulty {
      margin-left: auto;
      font-size: 0.63rem;
      color: var(--text-dim);
      white-space: nowrap;
    }

    .lock-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px;
      text-align: center;
      z-index: 50;
    }

    .lock-screen h1 {
      font-size: 1.2rem;
      color: var(--accent);
      margin-bottom: 14px;
    }

    .lock-screen p {
      color: var(--text-dim);
      font-size: 0.9rem;
      line-height: 1.65;
      max-width: 340px;
    }

    .lock-badge {
      margin-top: 24px;
      font-size: 0.63rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--danger);
      border: 1px solid rgba(168, 66, 92, 0.4);
      padding: 6px 14px;
      border-radius: 20px;
    }

    .reset-btn {
      margin-top: 20px;
      padding: 8px 16px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      border-radius: 8px;
      font-size: 0.75rem;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div id="app">
    <header>
      <div class="title-row">
        <span class="game-title">Chapter One</span>
        <span class="room-name" id="roomName">Khalisi</span>
      </div>
      <div class="meter-label">
        <span id="meterLabel">Lust</span>
        <span id="meterValue">0 / 100</span>
      </div>
      <div class="meter-track">
        <div class="meter-fill" id="meterFill" style="width:0%"></div>
      </div>
    </header>

    <main id="main"></main>
    <div class="choices" id="choices"></div>
  </div>

  <script>
    /* =========================================================================
   GENERISCHE TEXT-DUNGEON-ENGINE — ohne Inhalte.
   Alles Erzählerische kommt ausschließlich aus SCENES{} und CONFIG{}.
   Diese Datei enthält NUR Struktur/Logik, keine Story.

   Aufbau:
   1. CONFIG        – globale Einstellungen (Stat-Name, Startwerte, Storage-Keys)
   2. SCENES{}       – dein Content geht hier rein (aktuell 1 Platzhalter)
   3. ENDINGS{}      – deine Ending-Texte gehen hier rein
   4. Engine-Code    – unverändert lassen, greift nur auf 1–3 zu
   ========================================================================= */

    const CONFIG = {
      storageKeySave: "dungeon_save_v1",
      storageKeyLock: "dungeon_ending_locked",
      startScene: "PROLOG",
      startStatValue: 25,
      statMin: 0,
      statMax: 100,
      statLabel: "Lust", // z.B. "Erregung", "Mana", "Verdacht" ...
    };

    /* ---------------------------------------------------------------------
       2. SCENES — Datenmodell pro Szene:

       "sceneId": {
         title: string,
         baseText: string,                  // immer sichtbarer Basistext
         thresholdTexts: [                  // optional, je nach Statwert
           { min: number, max: number, text: string }
         ],
         hiddenThought: {                   // optional, ab Schwellwert sichtbar
           unlockAt: number,
           tag: string,
           text: string
         },
         choices: [
           {
             id: string,
             type: "type-a" | "type-b" | "neutral",   // rein visuelle Kategorie, frei belegbar
             icon: string,
             text: string,
             difficultyLabel: string,        // optional, nur Anzeige
             successChance: number,          // 0–1, Wahrscheinlichkeit für onSuccess
             requiresStat: number,           // optional, harte Voraussetzung (Gate)
             onSuccess: { next, statDelta, log } | { ending: "endingId" },
             onFail:    { next, statDelta, log },
             onFailRequirement: { next, statDelta, log }  // falls requiresStat nicht erfüllt
           }
         ],
         isFinalGate: boolean                // optional, nur zur eigenen Orientierung
       }
       --------------------------------------------------------------------- */

    const SCENES = {

      "PROLOG": {
        title: "Prolog",
        baseText: "The abyss does not merely exist; it breathes. It wraps around you like a shroud of frozen velvet, heavy and absolute, pressing against your chest until even the air in your lungs feels borrowed. There is no horizon here, no floor, no ceiling—only a suffocating, pitch-black infinity that swallows every sense whole.\n\nWho are you?\nThe question forms in the quiet corners of your mind, fragile and small. Where are you?\nNo sooner do the thoughts surface than the silence begins to warp. It starts as a low, vibrating hum deep within the dark, twisting into something cruel, echoing from everywhere and nowhere at once. It is not a sound you hear with your ears, but a mockery felt in the marrow of your bones—a cold, devilish laughter that delights in your ignorance. The darkness isn't just an absence of light; it is an observer. Watching. Waiting.\nYou strain your eyes, sweeping your gaze through the endless void, desperate to anchor yourself to anything. A wall, a stone, a shadow darker than the rest—there must be something here. A void this heavy cannot simply be empty.\nARGH!\nA sharp, fiery twinge flares near your belly button, tearing through you like a needle of molten glass. You flinch, doubling over as the sudden spike of agony shatters the paralysis holding you captive. Hands instinctively flying toward your stomach, you look down into the shadow—and for the briefest, heart-stopping fraction of a second, the void breaks.\nA blinding flash of luminescence tears through the gloom, blazing directly beneath your fingertips. It isn't a simple flame or a random spark. It is an intricate, violent geometry—a strange, web-like pattern carved in searing radiance that pulses once, violently, against your skin before vanishing back into the hungry dark.\nThe light is gone as quickly as it arrived, leaving behind the afterimage burned onto your retinas and the lingering heat on your skin. But the dark is no longer featureless. Now, you know it holds secrets—and whatever carved that mark into you has just begun to awaken.",
        thresholdTexts: [{
            min: 70,
            max: 75,
            text: ""
          },
          {
            min: 76,
            max: 100,
            text: ""
          }
        ],
        hiddenThought: {
          unlockAt: 100,
          tag: "",
          text: ""
        },
        choices: [{
            id: "placeholder_choice_a",
            type: "type-a",
            icon: "◆",
            text: "Touch your belly",
            difficultyLabel: "Curiosity",
            successChance: 40,
            onSuccess: {
              next: "SLEEP",
              statDelta: 1,
              log: "+1 Lust.\n\nYour hand trembles as you press your fingers against your stomach, desperately searching for the origin of that blinding spark. The fabric of your clothes feels strangely thin beneath your palm—cold, damp, and clinging to your skin like a second layer of dead weight.\n\nAt first, there is only the lingering ache, a dull and thrumming heat pulsing beneath your flesh. But as you apply pressure, a sudden, sharp sensation shoots through your nervous system. It isn't just pain—it is a physical jolt, a current of crackling energy that leaps from your skin straight into your fingertips.\n\nYou trace the area with careful, agonizing precision. Beneath your skin, the flesh feels unnaturally warm, almost feverish compared to the icy abyss around you. And then your fingertips catch on something impossible.\n\nLines. Fine, raised ridges carved into your skin, forming a precise, geometric topography that shouldn't exist on a human body. As you run your hand along the contours, the mark responds to your touch. A faint, ethereal glow bleeds through your fingers, casting a pale, violet light across your knuckles and revealing the faint mist of your breath in the freezing air.\n\nThe pattern is intricate—a series of sharp, interlocking runes and spiraling lines that hum with an ancient, restless power. With every heartbeat, the raised skin twitches, expanding and contracting like something alive, feeding on your breath, anchoring itself deeper into your core.\n\nThe devilish laughter in the darkness instantly dies down, replaced by a heavy, suffocating stillness. The void is no longer just watching you. It is watching the mark. And as the strange pattern continues to pulse softly beneath your palm, you realize with terrifying clarity that this light isn't a beacon of hope—it is a key, and whatever it unlocks has just begun to turn."
            },
            onFail: {
              next: "SLEEP",
              statDelta: -1,
              log: "-1 Lust.\n\nYour hand trembles as you press your fingers against your stomach, desperately searching for the origin of that blinding spark, but you feel nothing.\n\nThere is no raised mark, no jagged wound, no residual heat beneath your skin—only the flat, numb reality of your own body through the coarse fabric of your clothes. The agony that tore through you just a second ago has evaporated completely, leaving behind an unsettling, hollow emptiness that feels almost worse than the pain.\n\nYou slide your hands back and forth, frantically pressing deeper into your flesh, searching for a scar, a pulse, a trace of whatever had burned so brightly behind your eyelids. Nothing. It is as though your own nervous system is playing tricks on you, betraying your senses in this featureless expanse.\n\nWas it a hallucination? A dying spark of a frantic mind trying to fabricate light where none exists?\n\nThe darkness seems to swell in response to your confusion, leaning in closer, heavier. The silence stretches, taut and mocking, as if the void itself is amused by your desperation—watching you claw at your own skin in pursuit of a phantom. You are left standing in the freezing, absolute quiet, unsure if you can even trust the testimony of your own eyes, with nothing to hold onto except the lingering, terrifying doubt that you might truly be losing your mind..."
            }
          },
          {
            id: "placeholder_choice_b",
            type: "type-b",
            icon: "♥",
            text: "Try to remember the symbol",
            difficultyLabel: "Mindful",
            successChance: 35,
            onSuccess: {
              next: "WHO_YOU_ARE",
              statDelta: 10,
              log: "+10 Lust.\n\nIt was A delicate,sigil-like marking traced in faded obsidian and muted rose gold, nestled just above the curve of the hip and fading toward the center of the abdomen.\nThe mark resembles a stylized, inverted crescent moon interwoven with thorny, thorned vines that taper off into fine, ink-like wisps against the skin.\nBeneath low light, the inner linework catches a faint, bioluminescent shimmer—less like a tattoo and more like an ancient scar born of velvet and starlight.\nIt pulses with a soft, imperceptible warmth, serving as a subtle, captivating emblem of innate allure and quiet power."
            },
            onFail: {
              next: "SLEEP",
              statDelta: -3,
              log: "-3 Lust.\n\nYou strain your mind, desperately clawing at the fringes of your memory, trying to drag a single coherent thought out of the haze. There was something—something monumental, a truth so vital that the failure to grasp it feels like a physical ache in your chest. A name, a face, a warning, a purpose... it dances just beyond the reach of your thoughts, an elusive shadow taunting you from the fog.\n\nThe harder you push, the more violently your mind rebels. The thoughts fray at the edges, dissolving into fragmenting echoes before you can wrap your sanity around them. The effort is exhausting. A crushing, bone-deep weariness settles over your limbs, heavy as iron and cold as the void itself. Your eyelids feel weighted, each breath drawing in air that seems to grow thicker, slower, pulling you down into an irresistible undertow.\n\nThe quiet of the dark shifts from hostile to seductive, whispering a promise of release. Fighting it is like trying to hold back the tide with bare hands. Your knees give out, though you cannot tell if you fall onto stone, earth, or empty air.\n\nYour vision blurs, the faint, phantom afterimages of light finally snuffed out by an overwhelming lethargy. You let go of the memory. You let go of the fear. As your eyes drift shut, the cruel laughter of the abyss fades into a soft, rhythmic lullaby, dragging you down into a deep, dreamless sleep."
            }
          },
          {
            id: "placeholder_choice_neutral",
            type: "neutral",
            icon: "◆",
            text: "Just go back to sleep",
            difficultyLabel: "Simple",
            successChance: 100,
            onSuccess: {
              next: "SLEEP",
              statDelta: -2,
              log: "-2 Lust.\n\nA profound, cold apathy washes over you, drowning out the fear, the pain, and the frantic questions. You simply do not care. Who you were, where you are, why the darkness mocks you, or what that fleeting burst of light meant—none of it matters. The endless pursuit of answers feels like a fool's errand, an exhausting game you have no desire to play.\n\nYou surrender to the heaviness dragging at your limbs. The void, once so terrifyingly vast, transforms into a weightless blanket, wrapping around your shoulders and pressing softly against your tired eyes. You don't want to fight the shadows; you want to dissolve into them.\n\nYou let your body go limp, sinking into the quiet emptiness. The devilish laughter of the dark grows muffled and distant, as if retreating into the background of a dream you refuse to take part in. You close your eyes, shutting out the last lingering thoughts of the strange pattern, the pain, and the unknown world waiting beyond.\n\nBreathing out a long, slow sigh, you let the dark take you, turning your back on the mystery and choosing the soft, undisturbed silence of sleep."
            }
          },
          {
            id: "placeholder_choice_gate",
            type: "type-b",
            icon: "♥",
            text: "Start to masturbate",
            difficultyLabel: "Needs 'Lust' >= 50",
            requiresStat: 50,
            onSuccess: {
              ending: "ending_a"
            },
            onFailRequirement: {
              next: "SLEEP",
              statDelta: 0,
              log: "+0 Lust.\nYou reach down, intent on pressing your fingers against your flesh—only to encounter an impossible, sickening sensation of absolute nothingness.\n\nThere is no resistance. No friction of fabric, no warmth of skin, no firm contour of a torso. In fact, as you focus inward, the very concept of arms, fingers, and a chest begins to unravel. You try to twitch a finger, to bend a knee, to feel the steady thrum of a heart in your ribs, but your commands echo into a hollow vacuum.\n\nA chilling realization paralyzes your thoughts: you aren't actually touching anything because there is nothing *to* touch. You have no skin, no bone, no form. You are not a person standing in a dark room; you are merely a lingering spark of awareness, a disembodied consciousness drifting weightlessly through an endless ocean of nothingness. The memory of having a body feels like an old story you once heard, a phantom sensation fading faster than mist in the morning sun.\n\nWithout physical lungs, your sudden panic has nowhere to go. Without a throat, you cannot scream. The terrifying abstractness of existing as a phantom mind in a physical void shatters the fragile anchor holding your thoughts together.\n\nThe weight of the infinity pressing in from every side grows too immense for a mind without a shell to bear. The edges of your awareness begin to fray and unravel. The faint, ghostly concept of yourself dissolves, and the blinding horror gives way to a merciful, crushing numbness.\n\nYour consciousness collapses inward, folding into itself, and the oppressive dark swallows the last flickering fragment of who you were, plunging you back into the absolute, silent black."
            }
          }
        ]
      },
      // After Prolog Choices
      "SLEEP": {
        title: "SLEEP",
        baseText: "Sleep washes over you, carrying you from one darkness into the next. It is not the soft, restorative slumber of a weary traveller, but a slow sinking into endless expanses of black nothingness. There are no colors here, no voices, no phantom shapes drifting through the ether. You aren’t dreaming—or at least, you can’t remember doing so. There is only the long, featureless passage of time, stretching until the very concept of a minute or an hour loses all meaning.\n\nSo you wait to wake up…\n\nYou wait for the sudden return of breath, for the weight of your eyelids to yield, for the harsh reality of morning to break through the veil.\n\nBut you don’t.\n\nThe stillness remains unbroken. The quiet grows heavier, thicker, until a cold, creeping doubt begins to coil around the edges of your mind.\n\nDid you really fall asleep? Could you even have fallen asleep in a place like this?\n\nEverything that happened earlier didn’t exactly seem like a dream. The suffocating weight of the air, that cruel, echoing laughter that rattled your very soul, the sudden, searing agony near your navel—it was all too vivid, too sharp, too viscerally real. Dreams fade; they blur at the edges. But the memory of that blinding flash of light remains burned into your mind like a brand, raw and undeniable.\n\nIf you aren't asleep, then what is this timeless expanse holding you prisoner? And if you never truly went to sleep… what does that say about where you actually are?",
        thresholdTexts: [{
            min: 0,
            max: 34,
            text: "Deep within the hollow void, a low, rhythmic vibration begins to build. It is not something you hear, but something you feel—a slight, unmistakable twinge in your belly, pulsing with the slow, steady tempo of a sleeping heart.\n\nThump... thump... thump...\n\nWith every subtle throb, a strange, hollow ache blooms in the center of your being. It isn't just physical pain; it is a profound, gnawing sensation of absence. A phantom limb of the soul. You feel with absolute, agonizing certainty that you are incomplete—that a piece of you, something vital and foundational, has been ripped away and scattered across the dark.\n\nYou reach inward, clawing through the fog of your mind to name what is gone. Is it a memory? A name? A face? A purpose? Or perhaps a power that once belonged to you?\n\nThe harder you try to grasp it, the more elusive it becomes, sliding through your mental fingers like smoke. You are a puzzle with its most critical piece missing, left to pulse softly in the quiet dark, haunted by the terrifying knowledge of your own emptiness."
          },
          {
            min: 35,
            max: 100,
            text: "Slowly, terrifyingly, the pieces begin to slide into place. The fog in your mind recedes just enough to reveal a jagged, undeniable realization.\n\nThis place is not a dream. You are not dreaming. You are not asleep, nor are you awake. You exist in the terrifying twilight between states, anchored to a reality far stranger than any nightmare. This endless expanse, this weightless void, the burning pattern, the cruel laughter—it all makes a horrifying kind of sense now. That's your...\n\nSuddenly, the fabric of your perception tears open with a deafening, violent screech.\n\nThe very air around you fractures, splintering into static and jagged lines of raw, blinding light. The thoughts in your head are ripped away mid-sentence, replaced by a cold, mechanical intrusion that reverberates directly through your soul:\n\n[ERROR — THE PLAYER IS NOT YET READY FOR THE TRUTH]\n\n[CENSORSHIP OF THE TRUTH]\n\nYou try to fight it, to cling to the fleeting revelation that was just within your grasp, but the invisible force strikes again, heavier this time, wiping your thoughts clean like slate under a wet rag.\n\n[ERROR — THE PLAYER IS NOT YET READY FOR THE TRUTH]\n\n[CENSORSHIP OF THE TRUTH]\n\nA high-pitched, unbearable ringing fills the void, drowning out the last remnants of your sanity. The revelation is violently torn from your mind, sealed away behind an impenetrable wall of static and silence.\n\n[ERROR — THE PLAYER IS NOT YET READY FOR THE TRUTH]\n\n[CENSORSHIP OF THE TRUTH]\n\n[ERROR — THE PLAYER IS NOT YET READY FOR THE TRUTH]\n\n[CENSORSHIP OF THE TRUTH]\n\nThe noise cuts out instantly, leaving behind a silence far more terrifying than before. The truth was right there—glowing, perfect, and absolute. But something, or someone, just slammed the door in your face, leaving you reeling in the dark, stripped of the one answer that could have saved you."
          }
        ],
        hiddenThought: {
          unlockAt: 100,
          tag: "",
          text: ""
        },
        choices: [{
            id: "placeholder_choice_a",
            type: "type-a",
            icon: "◆",
            text: "Try to feel around",
            difficultyLabel: "Curiosity",
            successChance: 1,
            onSuccess: {
              next: "SLEEP",
              statDelta: 1,
              log: "+1 Lust.\nYou strain against the suffocating silence, desperate to take even a single step forward, to stretch out a hand and anchor yourself to something—anything. You reach out into the blackness, expecting stone, dirt, or perhaps the cold surface of a wall.\n\nNothing.\n\nYou shift your weight, attempting to place one foot in front of the other, but your legs find no resistance. There is no floor beneath you, no ceiling above, no walls at your sides. You aren't being held down by iron shackles or bound by heavy ropes; the reality is far more terrifying. You cannot move simply because the universe around you lacks the basic geometry to allow it. You are suspended in a realm devoid of direction, floating in an absolute, featureless medium where forward, backward, up, and down have ceased to exist.\n\nYou try again, kicking out, reaching desperately with phantom limbs, but your efforts yield only a sickening sense of vertigo. It is like swimming through vacuum, every movement swallowed instantly by the vast, unyielding nothingness.\n\nMinutes drag into hours, or perhaps days—time itself feels meaningless here. Gradually, the violent panic surging through your veins burns down into a quiet, icy hollow in your chest.\n\nA heavy, crushing realization settles over you: there is nothing you can do. No effort of will, no surge of strength, no desperate struggle can force the void to yield. You are completely, utterly powerless, left to drift in an ocean of static dark, a prisoner to an emptiness that refuses to let you go.\n"
            },
          },
          {
            id: "placeholder_choice_b",
            type: "type-b",
            icon: "◆♥",
            text: "Wonder who you are",
            difficultyLabel: "Mindful",
            successChance: 1,
            onSuccess: {

        currentScene: CONFIG.startScene,
        stat: CONFIG.startStatValue,
        log: []
      };
    }

    function saveState() {
      localStorage.setItem(CONFIG.storageKeySave, JSON.stringify(state));
    }

    function isLocked() {
      return localStorage.getItem(CONFIG.storageKeyLock) !== null;
    }

    function lockGame(endingId) {
      localStorage.setItem(CONFIG.storageKeyLock, JSON.stringify({
        ending: endingId,
        timestamp: new Date().toISOString()
      }));
    }

    function resetGame() {
      localStorage.removeItem(CONFIG.storageKeySave);
      localStorage.removeItem(CONFIG.storageKeyLock);
      state = loadState();
      render();
    }

    const mainEl = document.getElementById("main");
    const choicesEl = document.getElementById("choices");
    const roomNameEl = document.getElementById("roomName");
    const meterFillEl = document.getElementById("meterFill");
    const meterValueEl = document.getElementById("meterValue");
    const meterLabelEl = document.getElementById("meterLabel");

    function pickThreshold(scene, statValue) {
      if (!scene.thresholdTexts) return null;
      return scene.thresholdTexts.find(t => statValue >= t.min && statValue <= t.max);
    }

    /* Rendert einen Text-String mit \n als Absatzumbrüchen.
       Erzeugt für jeden Abschnitt ein eigenes <p>-Element mit der übergebenen
       Klasse und hängt sie an container an. Nutzt textContent (kein innerHTML),
       damit beliebiger Content-Text sicher bleibt. */
    function renderMultilineText(container, text, className) {
      if (!text) return;
      const paragraphs = text.split("\n").filter(line => line.trim().length > 0);
      paragraphs.forEach(paragraph => {
        const p = document.createElement("p");
        p.className = className;
        p.textContent = paragraph;
        container.appendChild(p);
      });
    }

    function render() {
      meterLabelEl.textContent = CONFIG.statLabel;

      if (isLocked()) {
        renderLockScreen();
        return;
      }

      const scene = SCENES[state.currentScene];
      if (!scene) {
        mainEl.innerHTML = `<p class="scene-text">Fehler: Szene "${state.currentScene}" existiert nicht in SCENES{}.</p>`;
        choicesEl.innerHTML = "";
        return;
      }

      roomNameEl.textContent = scene.title;
      meterFillEl.style.width = state.stat + "%";
      meterValueEl.textContent = state.stat + " / " + CONFIG.statMax;

      mainEl.innerHTML = "";

      // Übergangs-Log: was die letzte Entscheidung bewirkt hat, klar sichtbar
      // VOR dem neuen Szenentext, damit sich der Wechsel wie eine Konsequenz liest.
      const lastLog = state.log[state.log.length - 1];
      if (lastLog) {
        const transition = document.createElement("div");
        transition.className = "transition";

        const logBox = document.createElement("div");
        logBox.className = "transition-log";
        renderMultilineText(logBox, lastLog, "");
        transition.appendChild(logBox);

        const divider = document.createElement("div");
        divider.className = "transition-divider";
        divider.textContent = scene.title;
        transition.appendChild(divider);

        mainEl.appendChild(transition);
      }

      renderMultilineText(mainEl, scene.baseText, "scene-text");

      const threshold = pickThreshold(scene, state.stat);
      if (threshold) {
        renderMultilineText(mainEl, threshold.text, "threshold-text");
      }

      if (scene.hiddenThought && state.stat >= scene.hiddenThought.unlockAt) {
        const box = document.createElement("div");
        box.className = "hidden-thought";
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = scene.hiddenThought.tag;
        box.appendChild(tag);
        renderMultilineText(box, scene.hiddenThought.text, "");
        mainEl.appendChild(box);
      }

      renderChoices(scene);
    }

    function renderChoices(scene) {
      choicesEl.innerHTML = "";
      scene.choices.forEach(choice => {
        const btn = document.createElement("button");
        btn.className = "choice-btn " + choice.type;
        const meetsReq = !choice.requiresStat || state.stat >= choice.requiresStat;
        btn.innerHTML = `
      <span>${choice.icon || ""}</span>
      <span>${choice.text}</span>
      ${choice.difficultyLabel ? `<span class="difficulty">${meetsReq ? choice.difficultyLabel : "You dont have enough lust"}</span>` : ""}
    `;
        btn.addEventListener("click", () => resolveChoice(choice));
        choicesEl.appendChild(btn);
      });
    }

    function resolveChoice(choice) {
      // Hartes Gate prüfen
      if (choice.requiresStat && state.stat < choice.requiresStat) {
        applyOutcome(choice.onFailRequirement);
        return;
      }

      // Direkter Ending-Trigger ohne Probe
      if (choice.onSuccess && choice.onSuccess.ending && choice.successChance === undefined) {
        triggerEnding(choice.onSuccess.ending);
        return;
      }

      const roll = Math.random() * 100;
      // successChance wird hier direkt als Prozentwert + Stat-Bonus (z.B. 0-100) gewertet
      const chance = (choice.successChance + state.stat) ?? 1.0;
      const success = roll <= chance;
      
      const outcome = success ? choice.onSuccess : choice.onFail;
      applyOutcome(outcome);
    }

    function applyOutcome(outcome) {
      if (!outcome) return;

      if (outcome.ending) {
        triggerEnding(outcome.ending);
        return;
      }

      state.stat = Math.max(CONFIG.statMin, Math.min(CONFIG.statMax, state.stat + (outcome.statDelta || 0)));
      state.currentScene = outcome.next;
      state.log.push(outcome.log || null);
      saveState();
      render();
    }

    function triggerEnding(endingId) {
      lockGame(endingId);
      render();
    }

    function renderLockScreen() {
      const lockData = JSON.parse(localStorage.getItem(CONFIG.storageKeyLock));
      const ending = ENDINGS[lockData.ending] || {
        title: "[UNBEKANNTES ENDING: " + lockData.ending + "]",
        text: ""
      };

      mainEl.innerHTML = "";
      choicesEl.innerHTML = "";
      roomNameEl.textContent = "Abgeschlossen";
      meterFillEl.style.width = "100%";
      meterValueEl.textContent = "—";

      const screen = document.createElement("div");
      screen.className = "lock-screen";
      screen.innerHTML = `
    <h1>${ending.title}</h1>
    <p>${ending.text}</p>
    <div class="lock-badge">Einweg-Erfahrung — bereits abgeschlossen</div>
    <button class="reset-btn" id="resetBtn">Lokal zurücksetzen (Dev-Only)</button>
  `;
      document.getElementById("app").appendChild(screen);
      document.getElementById("resetBtn").addEventListener("click", resetGame);
    }

    render();
  </script>
</body>

</html>
